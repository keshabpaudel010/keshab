<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keshab</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    color: #f0f0f0;
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 24px 16px;
    background: linear-gradient(-45deg, #1e1b4b, #581c87, #831843, #9d174d, #164e63, #0e7490, #1e1b4b);
    background-size: 400% 400%;
    animation: gradientShift 9s ease infinite;
    overflow: hidden;
    position: relative;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(55px);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
  }
  .orb1 { width: 280px; height: 280px; background: #9333ea; top: -60px; left: -60px; animation: floatOrb1 11s ease-in-out infinite; }
  .orb2 { width: 240px; height: 240px; background: #22d3ee; bottom: -60px; right: -40px; animation: floatOrb2 13s ease-in-out infinite; }
  .orb3 { width: 200px; height: 200px; background: #ec4899; top: 45%; right: -80px; animation: floatOrb3 9s ease-in-out infinite; }
  .orb4 { width: 220px; height: 220px; background: #4f46e5; bottom: 10%; left: -70px; animation: floatOrb4 14s ease-in-out infinite; }
  @keyframes floatOrb1 { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(70px,90px) scale(1.25); } 66% { transform: translate(-30px,50px) scale(0.9); } }
  @keyframes floatOrb2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-60px,-70px) scale(1.3); } }
  @keyframes floatOrb3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-50px,60px) scale(1.2); } }
  @keyframes floatOrb4 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(50px,-40px) scale(1.15); } }

  .wrap { width: 100%; max-width: 400px; position: relative; z-index: 1; animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.8) translateY(24px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  #loginScreen {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 20px;
    padding: 32px 24px;
    animation: cardBreathe 4s ease-in-out infinite;
  }
  @keyframes cardBreathe {
    0%,100% { box-shadow: 0 8px 40px rgba(147,51,234,0.3); }
    50% { box-shadow: 0 8px 55px rgba(34,211,238,0.35); }
  }

  .version { text-align: center; margin-bottom: 22px; }
  .version-badge {
    display: inline-block;
    background: linear-gradient(135deg, #2dd4bf, #22d3ee);
    color: #0f0f0f;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 12px rgba(34, 211, 238, 0.5);
    animation: badgeBounce 1.8s ease-in-out infinite;
  }
  @keyframes badgeBounce { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.06); } }

  input[type=password] {
    width: 100%; padding: 14px 16px; font-size: 16px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
    color: #f0f0f0; outline: none; margin-bottom: 12px;
    transition: all 0.3s ease;
  }
  input[type=password]:focus {
    border-color: #22d3ee;
    box-shadow: 0 0 20px rgba(34, 211, 238, 0.55);
    transform: scale(1.03);
  }

  .btn, .ring-btn, .stop-btn { position: relative; overflow: hidden; }
  .btn::after, .ring-btn::after, .stop-btn::after {
    content: '';
    position: absolute; top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent);
    animation: shimmer 2.2s ease-in-out infinite;
  }
  @keyframes shimmer { 0% { left: -100%; } 55%,100% { left: 150%; } }

  .btn {
    width: 100%; padding: 14px; font-size: 15px; font-weight: 700;
    background: linear-gradient(135deg, #2dd4bf, #22d3ee);
    color: #0f0f0f; border: none;
    border-radius: 10px; cursor: pointer;
    box-shadow: 0 4px 18px rgba(34, 211, 238, 0.4);
    transition: transform 0.15s ease, box-shadow 0.3s ease;
  }
  .btn:active { transform: scale(0.94); }
  .btn:disabled { opacity: 0.5; cursor: default; box-shadow: none; }

  .err-msg { color: #f87171; font-size: 13px; text-align: center; margin-top: 10px; min-height: 18px; }
  .err-msg.shake { animation: shake 0.5s; }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-10px) rotate(-2deg); }
    40% { transform: translateX(10px) rotate(2deg); }
    60% { transform: translateX(-6px) rotate(-1deg); }
    80% { transform: translateX(6px) rotate(1deg); }
  }

  .device-card {
    position: relative; overflow: visible;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 14px; padding: 16px; margin-bottom: 12px;
    animation: slideIn 0.6s ease backwards, cardGlow 5s ease-in-out infinite;
  }
  @keyframes slideIn {
    0% { opacity: 0; transform: translateX(-40px) scale(0.8) rotate(-4deg); }
    60% { transform: translateX(6px) scale(1.04) rotate(1deg); }
    100% { opacity: 1; transform: translateX(0) scale(1) rotate(0deg); }
  }
  @keyframes cardGlow {
    0%,100% { box-shadow: 0 6px 26px rgba(147,51,234,0.3); }
    33% { box-shadow: 0 6px 30px rgba(34,211,238,0.35); }
    66% { box-shadow: 0 6px 30px rgba(236,72,153,0.35); }
  }

  .device-name { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .wiggle { display: inline-block; animation: wiggle 2s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }

  .device-btns { display: flex; gap: 8px; }
  .ring-btn, .stop-btn {
    flex: 1; padding: 10px; font-size: 14px; font-weight: 700;
    border: none; border-radius: 8px; cursor: pointer; color: #fff;
    text-shadow: 0 0 8px rgba(255,255,255,0.35);
    transition: transform 0.15s ease, box-shadow 0.3s ease, opacity 0.3s ease;
  }
  .ring-btn { background: linear-gradient(135deg, #4f46e5, #9333ea); }
  .ring-btn:not(:disabled) { animation: breathe 1.8s ease-in-out infinite, shimmer 2.2s ease-in-out infinite; }
  @keyframes breathe {
    0%,100% { box-shadow: 0 0 10px rgba(147,51,234,0.45); transform: scale(1); }
    50% { box-shadow: 0 0 26px rgba(147,51,234,0.9); transform: scale(1.02); }
  }
  .ring-btn:disabled { opacity: 0.55; animation: countdownPulse 1s ease-in-out infinite; }
  @keyframes countdownPulse { 0%,100% { opacity: 0.4; } 50% { opacity: 0.7; } }
  .ring-btn:active:not(:disabled) { transform: scale(0.9); }

  .stop-btn { background: linear-gradient(135deg, #dc2626, #ea580c); }
  .stop-btn:not(:disabled) { animation: breatheRed 1.5s ease-in-out infinite; }
  @keyframes breatheRed {
    0%,100% { box-shadow: 0 0 10px rgba(220,38,38,0.45); transform: scale(1); }
    50% { box-shadow: 0 0 22px rgba(220,38,38,0.85); transform: scale(1.02); }
  }
  .stop-btn:disabled { opacity: 0.4; }
  .stop-btn:active:not(:disabled) { transform: scale(0.9); }

  .ripple {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.55);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out;
    pointer-events: none;
  }
  @keyframes rippleAnim { to { transform: scale(2.8); opacity: 0; } }

  .device-status { font-size: 12px; margin-top: 8px; min-height: 16px; color: #999; }
  .device-status.sending { color: #facc15; animation: pulse 0.9s ease-in-out infinite; }
  .device-status.ringing { color: #facc15; font-weight: 700; font-size: 13px; animation: ringPulse 0.5s ease-in-out infinite; }
  .device-status.stopped { color: #4ade80; font-weight: 700; font-size: 13px; animation: popText 0.4s ease; }
  .device-status.offline { color: #f87171; animation: shakeText 0.4s ease; }
  .device-status.error   { color: #f87171; animation: shakeText 0.4s ease; }
  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
  @keyframes ringPulse {
    0%,100% { opacity: 0.85; transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.1) rotate(-2deg); }
    50% { opacity: 1; transform: scale(1.15) rotate(2deg); }
    75% { transform: scale(1.1) rotate(-1deg); }
  }
  @keyframes popText { 0% { opacity: 0; transform: scale(0.7); } 60% { transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes shakeText {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .confetti-piece {
    position: absolute; width: 6px; height: 6px; border-radius: 2px;
    animation: confettiFly 0.9s ease-out forwards;
    pointer-events: none; z-index: 5;
  }
  @keyframes confettiFly {
    0% { transform: translate(-50%,-50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0) rotate(180deg); opacity: 0; }
  }

  .screen-pulse {
    position: fixed; inset: 0;
    background: radial-gradient(circle, rgba(147,51,234,0.3), transparent 65%);
    pointer-events: none; z-index: 999;
    animation: screenFlash 0.7s ease-out forwards;
  }
  @keyframes screenFlash { 0% { opacity: 1; transform: scale(0.4); } 100% { opacity: 0; transform: scale(1.6); } }

  .empty-msg { text-align: center; color: #ccc; font-size: 14px; margin-top: 40px; position: relative; z-index: 1; }
  .spinner   { text-align: center; color: #ccc; font-size: 14px; animation: pulse 1s ease-in-out infinite; position: relative; z-index: 1; }
  #deviceList { position: relative; z-index: 1; }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="orb orb4"></div>

<div class="wrap">

  <div id="loginScreen">
    <div class="version"><span class="version-badge">v1.8</span></div>
    <input type="password" id="passInput" placeholder="Password" autocomplete="off">
    <button class="btn" id="loginBtn" onclick="doLogin()">Login</button>
    <div class="err-msg" id="errMsg"></div>
  </div>

  <div id="deviceScreen" style="display:none;">
    <div id="deviceList"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

<script>
const FIREBASE_API_KEY = "AIzaSyBSAknGfbpQ6zFjA3LlY6m_kPfINIFCyX4";
const FIREBASE_APP_ID  = "1:213285785887:web:9dda7e5f8fc475e4eea02a";
const ROOM = "0001";

firebase.initializeApp({
  apiKey:      FIREBASE_API_KEY,
  databaseURL: "https://phonefinder-cc9d2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:   "phonefinder-cc9d2",
  appId:       FIREBASE_APP_ID
});

const db   = firebase.database();
const auth = firebase.auth();
let osAppId = null;
let osKey   = null;

const ringStatusListeners = {};
const stoppedByWebsite = {};
const deviceState = {};
const timers = {};

// ── Sound (synthesized — no files, no music) ──────────────────────────────
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration, type, volume) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) {}
}
function soundClick()   { playTone(350, 0.07, "sine", 0.18); }
function soundRing()    { playTone(460, 0.08, "triangle", 0.22); }
function soundStop()    { playTone(220, 0.09, "triangle", 0.22); }
function soundSuccess() { playTone(600, 0.08, "sine", 0.18); setTimeout(() => playTone(800, 0.1, "sine", 0.18), 90); }
function soundError()   { playTone(150, 0.22, "sawtooth", 0.14); }

function shakeElement(el) {
  el.classList.remove("shake");
  void el.offsetWidth;
  el.classList.add("shake");
}

// ── Purely decorative effects (never touch app state) ─────────────────────
function addRipple(e, btn) {
  try {
    const ripple = document.createElement("span");
    ripple.className = "ripple";
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const x = (e.clientX || rect.left + rect.width/2) - rect.left - size/2;
    const y = (e.clientY || rect.top + rect.height/2) - rect.top - size/2;
    ripple.style.width = ripple.style.height = size + "px";
    ripple.style.left = x + "px";
    ripple.style.top = y + "px";
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 650);
  } catch (e) {}
}

function burstConfetti(deviceId) {
  try {
    const statusEl = document.getElementById("status-" + deviceId);
    const card = statusEl ? statusEl.closest(".device-card") : null;
    if (!card) return;
    const colors = ["#facc15","#4ade80","#22d3ee","#ec4899","#9333ea"];
    for (let i = 0; i < 14; i++) {
      const p = document.createElement("div");
      p.className = "confetti-piece";
      p.style.background = colors[i % colors.length];
      p.style.left = "50%";
      p.style.top = "20%";
      const angle = (Math.PI * 2 * i) / 14;
      const dist = 55 + Math.random() * 35;
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      card.appendChild(p);
      setTimeout(() => p.remove(), 950);
    }
  } catch (e) {}
}

function screenPulse() {
  try {
    const pulse = document.createElement("div");
    pulse.className = "screen-pulse";
    document.body.appendChild(pulse);
    setTimeout(() => pulse.remove(), 750);
  } catch (e) {}
}

function setCookie(name, value, days) {
  const d = new Date();
  d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
  document.cookie = name + "=" + value + ";expires=" + d.toUTCString() + ";path=/";
}
function getCookie(name) {
  for (let c of document.cookie.split(';')) {
    c = c.trim();
    if (c.startsWith(name + "=")) return c.substring(name.length + 1);
  }
  return "";
}

window.onload = function() {
  const loginBtnEl = document.getElementById("loginBtn");
  loginBtnEl.addEventListener("click", function(e) { addRipple(e, this); });

  const saved = getCookie("pf_pass");
  if (saved) {
    document.getElementById("passInput").value = saved;
    doLogin();
  }
};

document.getElementById("passInput")
  .addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

function doLogin() {
  const pass = document.getElementById("passInput").value.trim();
  if (!pass) return;
  soundClick();
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("errMsg");
  btn.disabled = true;
  btn.textContent = "...";
  err.textContent = "";

  auth.signInAnonymously()
    .then(() => db.ref("sitePassword/" + pass).get())
    .then(snap => {
      if (!snap.exists() || snap.val() !== true) {
        auth.signOut();
        err.textContent = "Incorrect password.";
        shakeElement(err);
        soundError();
        btn.disabled = false;
        btn.textContent = "Login";
        setCookie("pf_pass", "", -1);
        return;
      }
      setCookie("pf_pass", pass, 30);
      return db.ref("privateConfig").get().then(cfg => {
        osAppId = cfg.child("oneSignalAppId").val();
        osKey   = cfg.child("oneSignalKey").val();
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("deviceScreen").style.display = "block";
        loadDevices();
      });
    })
    .catch(() => {
      err.textContent = "Connection error.";
      shakeElement(err);
      soundError();
      btn.disabled = false;
      btn.textContent = "Login";
    });
}

function loadDevices() {
  const listEl = document.getElementById("deviceList");
  listEl.innerHTML = '<div class="spinner">Loading...</div>';

  db.ref("rooms/" + ROOM).on("value", snap => {
    Object.keys(ringStatusListeners).forEach(id => {
      db.ref("ringStatus/" + ROOM + "/" + id).off("value", ringStatusListeners[id]);
      delete ringStatusListeners[id];
    });
    listEl.innerHTML = "";
    if (!snap.exists()) {
      listEl.innerHTML = '<div class="empty-msg">No devices.</div>';
      return;
    }
    let count = 0;
    snap.forEach(child => {
      const deviceId    = child.key;
      const name        = child.child("name").val() || "Unknown";
      const oneSignalId = child.child("oneSignalId").val();
      if (!oneSignalId) return;
      count++;
      const card = document.createElement("div");
      card.className = "device-card";
      card.style.animationDelay = ((count - 1) * 0.1) + "s";
      card.innerHTML = `
        <div class="device-name"><span class="wiggle">📱</span> ${esc(name)}</div>
        <div class="device-btns">
          <button class="ring-btn" id="ring-${deviceId}"
            onclick="sendCmd('${oneSignalId}','${deviceId}','RING')">🔔 Ring</button>
          <button class="stop-btn" id="stop-${deviceId}" disabled
            onclick="sendCmd('${oneSignalId}','${deviceId}','STOP')">🔇 Stop</button>
        </div>
        <div class="device-status" id="status-${deviceId}"></div>
      `;
      listEl.appendChild(card);
      listenRingStatus(deviceId);

      const rBtn = card.querySelector(".ring-btn");
      const sBtn = card.querySelector(".stop-btn");
      rBtn.addEventListener("click", function(e) { addRipple(e, this); });
      sBtn.addEventListener("click", function(e) { addRipple(e, this); });
    });
    if (count === 0) listEl.innerHTML = '<div class="empty-msg">No devices.</div>';
  });
}

function getT(deviceId) {
  if (!timers[deviceId]) timers[deviceId] = {};
  return timers[deviceId];
}
function clearOffline(deviceId) {
  const t = getT(deviceId);
  if (t.offline) { clearTimeout(t.offline); t.offline = null; }
}
function clearCountdown(deviceId) {
  const t = getT(deviceId);
  if (t.countdown) { clearInterval(t.countdown); t.countdown = null; }
}
function clearPendingClear(deviceId) {
  const t = getT(deviceId);
  if (t.clear) { clearTimeout(t.clear); t.clear = null; }
}
function clearAllTimers(deviceId) {
  clearOffline(deviceId);
  clearCountdown(deviceId);
  clearPendingClear(deviceId);
}

function showStatus(deviceId, cls, txt, autoClearMs, onClear) {
  const statusEl = document.getElementById("status-" + deviceId);
  if (!statusEl) return;
  clearPendingClear(deviceId);
  setStatus(statusEl, cls, txt);
  if (autoClearMs) {
    getT(deviceId).clear = setTimeout(() => {
      setStatus(statusEl, "", "");
      getT(deviceId).clear = null;
      if (onClear) onClear();
    }, autoClearMs);
  }
}

function startCooldown(deviceId, ringBtn) {
  clearCountdown(deviceId);
  let secs = 35;
  ringBtn.disabled = true;
  ringBtn.textContent = `🔔 Ring (${secs}s)`;
  getT(deviceId).countdown = setInterval(() => {
    secs--;
    if (secs <= 0) {
      clearCountdown(deviceId);
      ringBtn.disabled = false;
      ringBtn.textContent = "🔔 Ring";
    } else {
      ringBtn.textContent = `🔔 Ring (${secs}s)`;
    }
  }, 1000);
}

function listenRingStatus(deviceId) {
  const listener = db.ref("ringStatus/" + ROOM + "/" + deviceId).on("value", snap => {
    const status  = snap.val();
    const ringBtn = document.getElementById("ring-" + deviceId);
    const stopBtn = document.getElementById("stop-" + deviceId);

    if (status === "ringing") {
      const wasRinging = deviceState[deviceId] === "ringing";
      clearOffline(deviceId);
      deviceState[deviceId] = "ringing";
      showStatus(deviceId, "ringing", "Ringing... 🔔");
      if (stopBtn) stopBtn.disabled = false;
      if (!wasRinging) {
        soundSuccess();
        burstConfetti(deviceId);
        screenPulse();
      }

    } else if (status === "stopped") {
      if (stoppedByWebsite[deviceId]) return;
      deviceState[deviceId] = "idle";
      clearAllTimers(deviceId);
      if (stopBtn) stopBtn.disabled = true;
      if (ringBtn) { ringBtn.disabled = false; ringBtn.textContent = "🔔 Ring"; }
      showStatus(deviceId, "stopped", "Stopped by device 🔇", 4000);
      soundStop();
    }
  });
  ringStatusListeners[deviceId] = listener;
}

function sendCmd(oneSignalId, deviceId, action) {
  const ringBtn = document.getElementById("ring-" + deviceId);
  const stopBtn = document.getElementById("stop-" + deviceId);

  if (action === "RING") {
    soundRing();
    stoppedByWebsite[deviceId] = false;
    deviceState[deviceId] = "sending";
    if (stopBtn) stopBtn.disabled = true;
    showStatus(deviceId, "sending", "Sending... 🔔");

    fetch("https://onesignal.com/api/v1/notifications", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Key " + osKey },
      body: JSON.stringify({
        app_id: osAppId,
        include_subscription_ids: [oneSignalId],
        priority: 10, content_available: true, ttl: 30,
        data: { action: "RING", from: "Website", roomCode: ROOM, timestamp: Date.now() },
        contents: { en: "Phone Finder" }
      })
    })
    .then(res => {
      if (!res.ok) throw new Error();
      startCooldown(deviceId, ringBtn);
      clearOffline(deviceId);
      getT(deviceId).offline = setTimeout(() => {
        if (deviceState[deviceId] === "sending") {
          deviceState[deviceId] = "offline";
          showStatus(deviceId, "offline", "📴 Offline or no response");
          soundError();
        }
      }, 3000);
    })
    .catch(() => {
      clearAllTimers(deviceId);
      showStatus(deviceId, "error", "Failed — try again", 3000);
      soundError();
      if (ringBtn) { ringBtn.disabled = false; ringBtn.textContent = "🔔 Ring"; }
    });

  } else {
    soundStop();
    stoppedByWebsite[deviceId] = true;
    deviceState[deviceId] = "idle";
    clearAllTimers(deviceId);
    if (stopBtn) stopBtn.disabled = true;
    if (ringBtn) { ringBtn.disabled = false; ringBtn.textContent = "🔔 Ring"; }
    showStatus(deviceId, "sending", "Stopping...");

    fetch("https://onesignal.com/api/v1/notifications", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Key " + osKey },
      body: JSON.stringify({
        app_id: osAppId,
        include_subscription_ids: [oneSignalId],
        priority: 10, content_available: true, ttl: 30,
        data: { action: "STOP", from: "Website", roomCode: ROOM, timestamp: Date.now() },
        contents: { en: "Phone Finder" }
      })
    })
    .then(res => {
      if (!res.ok) throw new Error();
      showStatus(deviceId, "stopped", "Stopped 🔇", 4000, () => {
        stoppedByWebsite[deviceId] = false;
      });
    })
    .catch(() => {
      showStatus(deviceId, "error", "Failed — try again", 3000);
      soundError();
      stoppedByWebsite[deviceId] = false;
    });
  }
}

function setStatus(el, cls, txt) {
  if (!el) return;
  el.className = "device-status" + (cls ? " " + cls : "");
  el.textContent = txt;
}
function esc(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
